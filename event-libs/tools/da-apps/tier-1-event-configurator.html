<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tier 1 Event Configurator</title>
  <!--
    ESP env override for local testing. `?espenv=`/`?eccEnv=` query params on
    the parent da.live URL never reach this iframe — DA's SDK only forwards
    `context.ref` — so getEventServiceEnv() (event-libs/v1/utils/utils.js)
    falls back to this metadata tag instead. Uncomment and set to one of:
    dev, dev02, stage, stage02, prod, local (see ENV_MAP in
    event-libs/v1/utils/constances.js). Defaults to prod when absent/commented.
  -->
  <!-- <meta name="event-service-env" content="stage" /> -->
  <link rel="stylesheet" href="/tier-1-event-configurator/tier-1-event-configurator.css" />
</head>
<body>
  <!--
    LOCAL-DEV entry point. Mirrors the da-events app path
    (tools/da-apps/tier-1-event-configurator) so `?ref=local` against the
    production da.live URL proxies here. It loads the app from the LOCAL
    server via root-relative paths (/tier-1-event-configurator/...), so serve
    from the event-libs inner root. This file is not used on aem.live — the
    da-events entry loads the deployed code there.
  -->
  <div id="app"></div>
  <script type="module" src="/tier-1-event-configurator/tier-1-event-configurator.js"></script>
</body>
</html>
