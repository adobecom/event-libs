<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sessions guide spacing fixture</title>
  <link rel="stylesheet" href="/event-libs/v1/c2/blocks/sessions-guide-full-page/sessions-guide-full-page.css">
</head>
<body>
  <div class="sessions-guide-full-page">
    <section class="sg-app sg-app--page">
      <div class="sg-full-page">
        <div class="sg-full-page__header-wrap">
          <header class="sg-header">
            <div class="sg-header-title-row"><h2 class="sg-header-title">Find more inspiration.</h2></div>
            <div class="sg-header-controls">
              <div class="sg-date-tabs">
                <button class="sg-date-tab sg-date-tab--active" type="button">Nov 10</button>
                <button class="sg-date-tab" type="button">Nov 11</button>
              </div>
              <div class="sg-right-controls">
                <button class="sg-view-btn" type="button">Live &amp; upcoming</button>
                <button class="sg-filter-btn" type="button" aria-label="Filter sessions"><span class="sg-filter-btn-label">Filter</span></button>
                <button class="sg-search-btn" type="button" aria-label="Search sessions"></button>
              </div>
            </div>
          </header>
        </div>
        <div class="sg-full-page__body">
          <div class="sg-view sg-view--live-upcoming">
            <div class="sg-carousel-section sg-carousel-section--recommended">
              <h3 class="sg-section-title">Recommended</h3>
              <article class="sg-live-card"><h4>Recommended session</h4></article>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <div class="sg-portal">
    <header class="sg-header">
      <div class="sg-header-controls">Session Guide widget controls</div>
    </header>
    <div class="sg-body-scroll">
      <div class="sg-view sg-view--live-upcoming">
        <div class="sg-carousel-section sg-carousel-section--recommended">
          <h3 class="sg-section-title">Recommended</h3>
          <article class="sg-live-card"><h4>Recommended session</h4></article>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
