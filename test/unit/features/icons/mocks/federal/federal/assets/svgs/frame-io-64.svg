<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64">
  <defs>
    <clipPath id="clip-path"><rect width="64" height="64" rx="11"/></clipPath>
    <linearGradient id="linear-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b53ff"/>
      <stop offset="1" stop-color="#8a83ff"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#clip-path)">
    <rect width="64" height="64" fill="url(#linear-gradient)"/>
    <use xlink:href="#clip-path"/>
  </g>
</svg>
